# gambarian-lead-cron — guaranteed retry + daily reconciliation for the lead pipeline.
# Deploy:  cd cron-worker && wrangler deploy
#
# Adapted from clients/luxemed/New Lending/cron-worker/wrangler.toml
# (digitalhook-os-, feature/luxemed-new-lending@613cdd30). Every Assuta
# resource id below has been replaced with a <GAMB_*> placeholder — resolve
# with `python -B scripts/verify-lead-pipeline-remap.mjs` before deploying.
#
# 1) Bind the SAME KV namespace that the Pages /api/lead function uses:
#      wrangler kv namespace list   → copy the id of the Gambaryan LEADS namespace
#      paste it into `id` below (replacing <GAMB_KV_ID>).
# 2) Bind the SAME D1 database as Pages LEADS_DB (replacing <GAMB_D1_ID> below),
#    after applying db/leads-schema.sql to it.
# 3) Set secrets (NOT committed — never put tokens in this file):
#      wrangler secret put ALBATO_WEBHOOK_URL
#      wrangler secret put TELEGRAM_TOKEN
#      wrangler secret put TELEGRAM_CHAT_ID
#      wrangler secret put SHEET_COUNT_URL      # Apps Script web-app URL (apps-script.gs), if used

name = "gambarian-lead-cron"
main = "src/index.js"
compatibility_date = "2026-05-01"

[[kv_namespaces]]
binding = "LEADS_KV"
id = "<GAMB_KV_ID>"

[[d1_databases]]
binding = "LEADS_DB"
database_name = "gambarian-leads-db"
database_id = "<GAMB_D1_ID>"

[[r2_buckets]]
binding = "LEADS_ARCHIVE"
bucket_name = "gambarian-leads-archive"

[triggers]
# Поле называется `crons`, НЕ `crontab` — с `crontab` wrangler молча деплоит
# 0 расписаний (см. ADFIX-SITE-SYSTEM-PLAYBOOK.md §1.7). После deploy владелец
# ОБЯЗАН проверить через Cloudflare API, что schedules == 3 — вывод wrangler
# сам по себе недостаточное доказательство.
crons = ["*/5 * * * *", "0 18 * * *", "30 2 * * *"]
