name: Deploy Previews

# Публикация 11 клиентских Preview на Cloudflare Pages из GitHub Actions.
#
# Зачем через CI, а не с машины владельца:
#   - токен живёт в GitHub Secrets и не попадает ни в чат, ни в репозиторий;
#   - на машине владельца ничего ставить не нужно (нет WSL — не помеха);
#   - у каждой публикации остаётся лог;
#   - запускается кнопкой или агентом, без ручных команд.
#
# Запуск только вручную: боевой адрес и Preview не должны уезжать от
# случайного push. Actions -> Deploy Previews -> Run workflow.
#
# Секреты (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   — Pages:Edit на аккаунт лендингов, Client IP пустой
#   CLOUDFLARE_ACCOUNT_ID  — 4799e9f76c607e036c430a148d06a80b
#
# Боевой адрес этот workflow не трогает: у каждого Preview свой --branch alias,
# ни один из них не равен production branch проекта (main).

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Один alias (пусто = все 11)"
        required: false
        default: ""

concurrency:
  group: deploy-previews
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-build.txt

      # build-action-bar.py поднимает Chromium через Playwright, поэтому одних
      # pip-зависимостей мало: без браузера сборка падает на launch(). В
      # AGENTS.md это отдельная команда, и она обязана быть и здесь.
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      # build/ не хранится в git — Preview собираются здесь же, из site/.
      - name: Build client previews
        run: |
          python -B scripts/build-preview.py site/gambarian-standalone.html --standalone
          python -B scripts/build-font-variants.py
          python -B scripts/build-hero-variants.py
          python -B scripts/build-action-bar.py
          python -B scripts/build-review-numbered.py

      # Публиковать непроверенное нельзя: гейты те же, что в CI.
      - name: Verify before publishing
        run: |
          python -B scripts/verify-client-copy.py
          python -m unittest discover -s scripts/tests -p 'test_verify_client_copy.py'
          python -B scripts/verify-client-previews.py
          node scripts/verify-lead-hook.mjs

      - name: Check token scope
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Не заданы секреты CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          # Секрет, записанный через конвейер (например `gh secret set NAME | ...`),
          # уносит с собой завершающий перевод строки. Значение не печатаем — только
          # длины, по ним расхождение видно сразу.
          raw_len=${#CLOUDFLARE_API_TOKEN}
          trimmed=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d ' \t\r\n')
          trim_len=${#trimmed}
          echo "Длина секрета: $raw_len; без пробелов и переводов строки: $trim_len"
          if [ "$raw_len" -ne "$trim_len" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN содержит пробельные символы или перевод строки."
            echo "::error::Записать заново значением, а не через конвейер: gh secret set CLOUDFLARE_API_TOKEN --body \$token"
            exit 1
          fi

          # Шаг 1: принимает ли Cloudflare сам токен. Раньше здесь был один общий
          # текст «токен от другого аккаунта» на любой неудачный ответ, и отказ в
          # аутентификации выглядел как проблема с аккаунтом. Это разные поломки.
          verify=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          # Разбираем JSON, а не ищем подстроку: Cloudflare отдаёт УСПЕШНЫЕ ответы
          # с отступами ("success": true — с пробелом), а ошибки компактно
          # ("success":false). grep по '"success":true' поэтому не находил успех
          # никогда и объявлял отказом любой нормальный ответ (инцидент 2026-08-17).
          if ! printf '%s' "$verify" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("success") else 1)' 2>/dev/null; then
            echo "::error::Cloudflare отклонил токен: аутентификация не прошла."
            echo "::error::Причина не в аккаунте. Токен недействителен, отозван, истёк либо ограничен по Client IP."
            echo "Ответ Cloudflare:"
            echo "$verify" | head -c 400
            exit 1
          fi
          echo "Токен принят Cloudflare."

          # Account id тоже секрет, тоже маскируется и тоже мог приехать с лишним
          # символом. На неверный id Cloudflare отвечает тем же «Authentication
          # error», что и на плохой токен, поэтому проверяем его форму отдельно.
          acc_trim=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d ' \t\r\n')
          echo "Длина account id: ${#CLOUDFLARE_ACCOUNT_ID}; без пробелов: ${#acc_trim}"
          if [ "${#CLOUDFLARE_ACCOUNT_ID}" -ne "${#acc_trim}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID содержит пробельные символы или перевод строки."
            exit 1
          fi
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID не похож на идентификатор аккаунта Cloudflare."
            echo "::error::Ожидается 32 знака: цифры и строчные a-f. Сейчас длина ${#CLOUDFLARE_ACCOUNT_ID}."
            exit 1
          fi

          # Шаг 2: видит ли токен нужный аккаунт.
          projects=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if ! printf '%s' "$projects" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("success") else 1)' 2>/dev/null; then
            echo "::error::Токен действителен, но обращение к указанному аккаунту отклонено."
            echo "Ответ Cloudflare:"
            echo "$projects" | head -c 300
            echo
            # Спрашиваем, какие аккаунты этот токен вообще видит: так сразу видно,
            # не выдано ли право на нужный аккаунт или в секрете указан не тот id.
            curl -sS "https://api.cloudflare.com/client/v4/accounts" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > "$RUNNER_TEMP/accounts.json"
            python3 - <<'PY2'
          import json, os, pathlib

          want = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          try:
              data = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "accounts.json").read_text())
          except Exception:
              data = {}
          if not data.get("success"):
              print("Список аккаунтов получить не удалось — у токена нет права Account Settings: Read.")
              print("::error::Проверить вручную, какому аккаунту принадлежит токен.")
              raise SystemExit(0)
          res = data.get("result") or []
          print("Аккаунты, доступные этому токену:")
          if not res:
              print("  токен не привязан ни к одному аккаунту")
          for a in res:
              print(f"  {a.get('id')}  {a.get('name')}")
          print()
          if any(a.get("id") == want for a in res):
              print("::error::Аккаунт токену виден, но право Account -> Cloudflare Pages -> Edit на него не выдано.")
          else:
              print("::error::Идентификатора из секрета CLOUDFLARE_ACCOUNT_ID нет в этом списке.")
              print("::error::Либо в секрете не тот аккаунт, либо токен выпущен в другом аккаунте.")
              print("::error::Взять id из списка выше и записать его в CLOUDFLARE_ACCOUNT_ID.")
          PY2
            exit 1
          fi
          # "active" != "нужный аккаунт": токен, валидный для чужого аккаунта,
          # заставит wrangler молча создать дубликат проекта (инцидент 2026-05-13).
          if ! printf '%s' "$projects" | python3 -c 'import json,sys; sys.exit(0 if any(p.get("name")=="gambarian-landing" for p in (json.load(sys.stdin).get("result") or [])) else 1)' 2>/dev/null; then
            echo "::error::Аутентификация прошла, но в аккаунте $CLOUDFLARE_ACCOUNT_ID нет проекта gambarian-landing — токен от другого аккаунта."
            echo "$projects" | head -c 400
            exit 1
          fi
          echo "gambarian-landing найден в аккаунте — токен подходит."

          # Боевую ветку спрашиваем у API, а не считаем, что это main.
          # Если хоть один Preview alias совпадёт с ней, публикация Preview
          # уехала бы на боевой адрес. deploy-pages.ps1 делает ровно так же.
          printf '%s' "$projects" > "$RUNNER_TEMP/pages-projects.json"
          python3 - <<'PY'
          import json, os, pathlib, sys

          data = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "pages-projects.json").read_text())
          proj = next((p for p in data["result"] if p["name"] == "gambarian-landing"), None)
          if proj is None:
              print("::error::gambarian-landing пропал из ответа API между проверками")
              sys.exit(1)
          prod = proj.get("production_branch")
          aliases = [p["branch"] for p in json.loads(
              pathlib.Path("scripts/client-preview-map.json").read_text())["previews"]]
          print(f"production_branch проекта: {prod!r}")
          clash = [a for a in aliases if a == prod]
          if clash:
              print(f"::error::Preview alias {clash} совпадает с боевой веткой {prod!r} —"
                    " публикация Preview уехала бы на боевой адрес. Остановлено.")
              sys.exit(1)
          print(f"Ни один из {len(aliases)} Preview alias не равен боевой ветке —"
                " боевой адрес недостижим.")
          PY

      - name: Deploy previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONLY: ${{ inputs.only }}
        run: bash scripts/deploy-previews.sh "$ONLY"

      # Exit code wrangler за доказательство не принимается: на части
      # предупреждений он выходит с нулём (docs/FINAL-QA-CHECKLIST.md, OPEN).
      - name: Live readback
        # ONLY передаётся через env, а не подстановкой ${{ }} внутрь run:
        # выражение подставляется в скрипт до запуска shell, и значение вида
        # `x"; …; "` выполнилось бы как команда. Шаг Deploy делает так же.
        env:
          ONLY: ${{ inputs.only }}
        run: |
          sleep 15
          if [ -n "$ONLY" ]; then
            python -B scripts/verify-live-previews.py --only "$ONLY"
          else
            python -B scripts/verify-live-previews.py
          fi
